---
# GitLab CI/CD Pipeline for audit
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    - company
    # The group's Windows runner also carries the `company` tag and was
    # picking up Linux shell jobs; require a Linux runner.
    - linux
    # Keep these jobs on Linux AMD64 runners.
    - amd64

# GAP-064: components pinned to full commit SHAs (immutable) instead of
# mutable tags. The tag each SHA corresponds to is kept as a comment.
#   3122045afd7832332b342ca72065e4db7dde5ed4 = v1.55.8
include:
  # Run the complete suite on macOS to validate portable DNS entropy.
  - component: gitlab.com/devnw/ci-catalog/zig-test-macos@402e8986ef2d220db1c2591a461ba60850c59e5b
    inputs:
      zig_version: "0.16.0"
      job_suffix: "-portable-deps"
      test_step: test-all
      test_options: "-j2 --summary all"
      allow_failure: false

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724  # v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724  # v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724  # v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724  # v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724  # v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"
  ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  # GAP-065: expected SHA-256 of the Zig toolchain tarball, pinned per
  # architecture so verification does not trust ziglang.org (the same origin
  # that serves the tarball) at download time. When bumping ZIG_VERSION,
  # update these from https://ziglang.org/download/index.json (the `shasum`
  # field). If left empty, .install-zig falls back to fetching index.json,
  # which is same-origin verification only — operators should keep these
  # pinned.
  ZIG_TARBALL_SHA256_X86_64: "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
  ZIG_TARBALL_SHA256_AARCH64: "ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17"

stages:
  - prepare
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02, GAP-065).
# Tarball verification prefers the pinned ZIG_TARBALL_SHA256_* CI variables
# (independent of the download origin). Only when the pin for the current
# architecture is empty does it fall back to fetching the expected hash from
# ziglang.org's index.json — same-origin verification, weaker; operators
# should keep the pins populated.
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64"; PINNED_SHA="${ZIG_TARBALL_SHA256_X86_64:-}" ;;
        aarch64) ZIG_ARCH="aarch64"; PINNED_SHA="${ZIG_TARBALL_SHA256_AARCH64:-}" ;;
        arm64)   ZIG_ARCH="aarch64"; PINNED_SHA="${ZIG_TARBALL_SHA256_AARCH64:-}" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      if [ -n "${PINNED_SHA}" ]; then
        EXPECTED_HASH="${PINNED_SHA}"
        echo "Using pinned SHA-256 for ${ZIG_ARCH}-linux-${ZIG_VERSION}"
      else
        echo "WARNING: no pinned ZIG_TARBALL_SHA256 for ${ZIG_ARCH}; falling back to index.json (same-origin verification)"
        INDEX_FILE=$(mktemp)
        curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
        EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
          python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
        rm -f "${INDEX_FILE}"
      fi
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Toolchains have one cache writer; each build mode owns its compiler cache.
# Include downloaded packages and bound compiler/package uploads to 2 GiB.
.zig-cache: &zig-cache
  - key: "zig-toolchain-${ZIG_VERSION}-linux-amd64"
    paths: ["zig-${ZIG_VERSION}/"]
    policy: pull
  - key:
      prefix: "zig-compile-${ZIG_VERSION}-linux-amd64-${CI_JOB_NAME}"
      files: [build.zig.zon]
    paths: [.zig-cache/, .zig-global-cache/]

.trim-zig-cache: &trim-zig-cache
  - |
    size=$(du -sm .zig-cache .zig-global-cache 2>/dev/null | awk '{sum += $1} END {print sum+0}')
    if [ "$size" -gt 2048 ]; then rm -rf .zig-cache .zig-global-cache; fi

prepare-zig:
  stage: prepare
  image: debian:bookworm-slim
  script:
    - *install-zig
  cache:
    key: "zig-toolchain-${ZIG_VERSION}-linux-amd64"
    paths: ["zig-${ZIG_VERSION}/"]
    policy: pull-push

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
# SONNY-2394: the component also sets ZIG_VERSION as a job-level variable,
# which takes precedence over the global ZIG_VERSION above, so overriding
# cache/before_script alone still left the job downloading Zig 0.14.0 and
# verifying it against the 0.16.0 SHA-256 pins -- always failing the
# checksum check. Override the job-level variable too.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  cache:
    key: "zig-toolchain-${ZIG_VERSION}-linux-amd64"
    paths: ["zig-${ZIG_VERSION}/"]
    policy: pull
  before_script:
    - *install-zig

# GAP-071: lint gate for the Python tooling under scripts/.
# ruff version pinned to match .pre-commit-config.yaml (ruff-pre-commit v0.14.14).
# SONNY-2394: this repo has no scripts/ directory yet, so gate the job on
# Python sources actually existing (see devnw/codepros/geode/geode-argo-arda
# for the same exists: convention) instead of failing every pipeline.
python-lint:
  stage: lint
  image: python:3.15-slim
  before_script:
    - pip install ruff==0.14.14
  script:
    - ruff check scripts/
    - ruff format --check scripts/
  rules:
    - exists: ["scripts/**/*.py"]

# Build job
build:
  stage: build
  needs: [prepare-zig]
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build check

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

test-integration-release-safe:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseSafe --summary all
  needs:
    - build

test-integration-release-fast:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-integration -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# All tests (unit + integration + CEF + filters + transports)
test:
  stage: test
  image: debian:bookworm-slim
  cache: *zig-cache
  after_script: *trim-zig-cache
  before_script:
    - *install-zig
  script:
    - zig build test-all --summary all
  needs:
    - build

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  cache: *zig-cache
  after_script: *trim-zig-cache
  image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  tags: [company, linux, x86]
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    # Handwritten jobs run on branches; suppress partial duplicate MR pipelines.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

zig-test-macos-portable-deps-0.16.0:
  tags: [dedicated, macos, arm]
  image: macos-26-xcode-26
  needs: []
  variables:
    ZIG_GLOBAL_CACHE_DIR: "$CI_PROJECT_DIR/.zig-global-cache"
  cache:
    key:
      prefix: "zig-macos-0.16.0-aarch64"
      files: [build.zig.zon]
    paths: [zig-0.16.0/, .zig-global-cache/, .zig-cache/]
  after_script: *trim-zig-cache
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'
